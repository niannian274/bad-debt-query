<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车辆坏账查询系统</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#6B8DD6 100%);min-height:100vh;padding:20px}
.container{max-width:1000px;margin:0 auto}
.header{text-align:center;padding:40px 0 30px;color:white}
.header h1{font-size:2.2rem;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,0.2);margin-bottom:8px}
.header p{opacity:0.85;font-size:1rem}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}
@media(max-width:640px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:rgba(255,255,255,0.15);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.25);border-radius:16px;padding:20px;text-align:center;color:white;transition:transform 0.2s}
.stat-card:hover{transform:translateY(-3px)}
.stat-card .number{font-size:1.8rem;font-weight:700;display:block;margin-bottom:4px}
.stat-card .label{font-size:0.85rem;opacity:0.85}
.search-box{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-radius:20px;padding:25px;margin-bottom:25px;box-shadow:0 8px 32px rgba(0,0,0,0.12)}
.search-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;padding:14px 20px;border:2px solid #e8e8ff;border-radius:14px;font-size:1.05rem;outline:none;transition:border-color 0.2s;background:#fafaff}
.search-input:focus{border-color:#667eea}
.search-btn{padding:14px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:14px;font-size:1rem;font-weight:600;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s}
.search-btn:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(102,126,234,0.4)}
.quick-tags{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.quick-tag{padding:6px 14px;background:#f0f0ff;border-radius:20px;font-size:0.85rem;color:#667eea;cursor:pointer;transition:background 0.2s;border:1px solid #e0e0ff}
.quick-tag:hover{background:#e0e0ff}
.tab-bar{display:flex;gap:4px;margin-bottom:20px}
.tab-btn{flex:1;padding:12px;border:none;border-radius:12px;font-size:0.95rem;font-weight:600;cursor:pointer;background:rgba(255,255,255,0.25);color:rgba(255,255,255,0.8);transition:all 0.2s}
.tab-btn.active{background:rgba(255,255,255,0.95);color:#667eea}
.result-card{background:rgba(255,255,255,0.95);border-radius:20px;padding:25px;box-shadow:0 8px 32px rgba(0,0,0,0.12);display:none;margin-bottom:20px}
.result-card.show{display:block}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.result-header h2{font-size:1.2rem;color:#333}
.result-count{font-size:0.9rem;color:#888}
.detail-table{width:100%;border-collapse:collapse;font-size:0.85rem;display:none}
.detail-table.show{display:table}
.detail-table th{background:#f5f5ff;padding:12px 10px;text-align:left;font-weight:600;color:#555;border-bottom:2px solid #e0e0ff;white-space:nowrap}
.detail-table td{padding:10px;border-bottom:1px solid #f0f0ff;color:#444}
.detail-table tr:hover td{background:#fafaff}
.plate-cell{color:#667eea;font-weight:700;cursor:pointer}
.badge-xd{display:inline-block;padding:3px 10px;border-radius:10px;font-size:0.73rem;font-weight:600;background:rgba(255,46,147,0.12);color:#FF2E93}
.badge-rz{display:inline-block;padding:3px 10px;border-radius:10px;font-size:0.73rem;font-weight:600;background:rgba(102,126,234,0.12);color:#667eea}
.empty-state{text-align:center;padding:60px 20px;color:#888}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
.result-item{display:flex;align-items:center;padding:20px;border-radius:16px;border-left:4px solid #667eea;background:#f8f9ff;margin-bottom:12px;gap:20px;flex-wrap:wrap}
.result-plate{font-size:1.4rem;font-weight:700;color:#667eea;min-width:140px}
.result-amount{font-size:1.6rem;font-weight:700;color:#e53935}
.result-type{font-size:0.85rem;color:#888}
.footer{text-align:center;padding:40px 0;color:rgba(255,255,255,0.5);font-size:0.8rem}
</style>
</head>

function formatAmount(v) {
  if (!v) return '-';
  const n = parseFloat(v);
  if (isNaN(n)) return v;
  return n.toLocaleString('zh-CN', {minimumFractionDigits:2,maximumFractionDigits:2});
}

function doSearch() {
  const raw = document.getElementById('searchInput').value.trim().toUpperCase();
  const card = document.getElementById('resultCard');
  const counter = document.getElementById('searchCount');

  if (!raw) {
    card.className = 'result-card';
    card.innerHTML = '';
    counter.textContent = '-';
    return;
  }

  const matches = DATA.filter(r => {
    const p = (r.plate || '').toUpperCase();
    return p.includes(raw);
  });

  if (matches.length === 0) {
    card.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><div style="font-size:1.1rem;font-weight:600;margin-bottom:6px">未找到记录</div><div style="font-size:.9rem">车牌 "<strong style="color:#667eea">${raw}</strong>" 在 3385 条记录中不存在</div></div>`;
    card.className = 'result-card show';
    counter.textContent = '0';
    return;
  }

  matches.sort((a,b) => { const na = parseFloat(a.amount)||0; const nb = parseFloat(b.amount)||0; return nb - na; });
  const totalAmt = matches.reduce((s,r) => s + (parseFloat(r.amount)||0), 0);
  const totalHtml = matches.length === 1
    ? `<span class="result-count" style="color:#e53935;font-weight:600">合计: ¥${totalAmt.toLocaleString('zh-CN',{minimumFractionDigits:2})}</span>`
    : '';

  card.innerHTML = `
    <div class="result-header">
      <h2>🔍 搜索结果：${raw}</h2>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="result-count">找到 ${matches.length} 条</span>
        ${totalHtml}
      </div>
    </div>
    ${matches.map(r => `
      <div class="result-item">
        <div class="result-plate">🚘 ${r.plate}</div>
        <div style="flex:1">
          <div class="result-amount">¥ ${formatAmount(r.amount)}</div>
          <div class="result-type"><span class="${r.type.includes('经租')?'badge-xd':'badge-rz'}">${r.type}</span></div>
        </div>
      </div>
    `).join('')}`;
  card.className = 'result-card show';
  counter.textContent = matches.length;
}

function quickSearch(plate) {
  document.getElementById('searchInput').value = plate;
  doSearch();
}

(function(){
  const tags = DATA.slice(0, 8).map(r => r.plate).filter(Boolean);
  document.getElementById('quickTags').innerHTML = tags.map(p =>
    `<span class="quick-tag" onclick="quickSearch('${p}')">${p}</span>`
  ).join('');
})();
</script>
